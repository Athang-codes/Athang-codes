<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Athang developer profile</title>
<desc id="desc">Animated developer profile banner for Athang.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0b0f"/>
    <stop offset="0.55" stop-color="#15151d"/>
    <stop offset="1" stop-color="#0a0a0d"/>
  </linearGradient>
  <radialGradient id="glow1">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".24"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop stop-color="#8b5cf6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#c4b5fd" stop-opacity=".9"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="round"><rect x="8" y="8" width="1184" height="404" rx="28"/></clipPath>
</defs>
<rect x="8" y="8" width="1184" height="404" rx="28" fill="url(#bg)" stroke="#2a2a36"/>
<g clip-path="url(#round)">
  <circle cx="990" cy="55" r="260" fill="url(#glow1)" filter="url(#blur)">
    <animate attributeName="cx" values="990;850;990" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;180;55" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="370" r="230" fill="url(#glow2)" filter="url(#blur)">
    <animate attributeName="cx" values="160;330;160" dur="11s" repeatCount="indefinite"/>
  </circle>
  <path d="M-80 320 C180 220 350 430 610 300 S1060 150 1280 250" fill="none" stroke="url(#line)" stroke-width="2" opacity=".55">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M-80 320 C180 220 350 430 610 300 S1060 150 1280 250;M-80 285 C190 390 380 170 650 290 S1030 370 1280 190;M-80 320 C180 220 350 430 610 300 S1060 150 1280 250"/>
  </path>
  <g opacity=".14" stroke="#fff">
    <path d="M40 80H1160M40 140H1160M40 200H1160M40 260H1160M40 320H1160M40 380H1160"/>
    <path d="M100 35V385M220 35V385M340 35V385M460 35V385M580 35V385M700 35V385M820 35V385M940 35V385M1060 35V385"/>
  </g>
  <g transform="translate(78 72)">
    <rect width="1044" height="276" rx="20" fill="#09090d" fill-opacity=".62" stroke="#ffffff" stroke-opacity=".10"/>
    <circle cx="28" cy="25" r="5" fill="#ff6b6b"/><circle cx="46" cy="25" r="5" fill="#ffd166"/><circle cx="64" cy="25" r="5" fill="#06d6a0"/>
    <text x="92" y="30" fill="#777783" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">athang@github ~ profile</text>
    <text x="38" y="92" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$ whoami</text>
    <text x="38" y="130" fill="#f5f5f7" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Athang</text>
    <text x="38" y="160" fill="#9ca3af" font-family="Inter, Arial, sans-serif" font-size="17">software developer · AI explorer · builder</text>
    <text x="38" y="205" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$ cat focus.txt</text>
    <text x="38" y="235" fill="#d4d4dc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">C++  ·  Rust  ·  C#  ·  TypeScript  ·  AI/LLMs  ·  systems</text>
    <rect x="38" y="252" width="8" height="18" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
</svg>