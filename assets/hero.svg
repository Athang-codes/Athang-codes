<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f5"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <radialGradient id="spot">
    <stop stop-color="#ddd6fe" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="3" y="3" width="1194" height="294" rx="18" fill="url(#paper)" stroke="#e4e4e7"/>
<circle cx="1040" cy="55" r="190" fill="url(#spot)" opacity=".7"/>
<circle cx="1040" cy="55" r="190" fill="none" stroke="#e9d5ff" stroke-width="1" opacity=".6"/>
<circle cx="1040" cy="55" r="135" fill="none" stroke="#cffafe" stroke-width="1" opacity=".55"/>
<circle cx="1040" cy="55" r="80" fill="none" stroke="#e9d5ff" stroke-width="1" opacity=".8"/>

<g stroke="#d4d4d8" opacity=".55">
  <path d="M40 250H1160"/>
  <path d="M40 55H1160"/>
</g>

<g transform="translate(62 48)">
  <text x="0" y="12" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#71717a" letter-spacing="3">ATHANG-CODES</text>
  <text x="0" y="91" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#18181b" letter-spacing="-4">ATHANG</text>
  <rect x="0" y="111" width="115" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="70;140;70" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="0" y="151" font-family="Arial,sans-serif" font-size="16" fill="#52525b">software engineer · systems · AI</text>
  <text x="0" y="182" font-family="Arial,sans-serif" font-size="13" fill="#71717a">I like understanding the layer underneath the thing.</text>
</g>

<g transform="translate(825 55)">
  <text x="0" y="0" font-family="monospace" font-size="9" fill="#a1a1aa" letter-spacing="2">CURRENTLY</text>
  <text x="0" y="28" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#27272a">building + experimenting</text>
  <text x="0" y="53" font-family="monospace" font-size="11" fill="#71717a">C++  /  Rust  /  C#</text>
  <text x="0" y="73" font-family="monospace" font-size="11" fill="#71717a">TypeScript  /  AI</text>
</g>

<g transform="translate(62 268)">
  <circle cx="4" cy="-3" r="4" fill="#22c55e"/>
  <text x="16" y="1" font-family="monospace" font-size="9" fill="#71717a">building in public</text>
</g>

<text x="1138" y="268" text-anchor="end" font-family="monospace" font-size="9" fill="#a1a1aa">01 / 2026</text>

<g opacity=".5">
  <circle cx="1040" cy="55" r="5" fill="#7c3aed">
    <animateMotion dur="6s" repeatCount="indefinite" path="M0 0 A135 135 0 1 1 -0.1 0"/>
  </circle>
</g>
</svg>