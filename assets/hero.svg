<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0a0a0d"/>
    <stop offset="0.55" stop-color="#111117"/>
    <stop offset="1" stop-color="#090a0c"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#8b5cf6" stop-opacity=".30"/>
    <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".08"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8b5cf6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#c4b5fd" stop-opacity=".75"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>

<rect x="4" y="4" width="1192" height="312" rx="22" fill="url(#bg)" stroke="#24242b"/>

<circle cx="1000" cy="105" r="230" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="cx" values="1000;900;1000" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="105;155;105" dur="10s" repeatCount="indefinite"/>
</circle>

